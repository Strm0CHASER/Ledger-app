<html lang="en" data-theme="dark" data-style="terminal"><head><meta charset="utf-8">

<title>Ledger</title>
<style>
:root{--bg:#F1EFEE;--card:#fff;--ink:#222020;--head:#000;--mute:#6C6663;--line:#E2DEDC;--bur:#7A1F35;--brown:#5C4033;--track:#DDD8D5;--soft:#F7F1F2;--ok:#5C4033}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141313;--card:#1F1D1D;--ink:#EDE9E7;--head:#fff;--mute:#A39C98;--line:#343030;--bur:#B24A63;--brown:#B08A72;--track:#3A3535;--soft:#2A2224;--ok:#B08A72}}
:root[data-theme="dark"]{--bg:#141313;--card:#1F1D1D;--ink:#EDE9E7;--head:#fff;--mute:#A39C98;--line:#343030;--bur:#B24A63;--brown:#B08A72;--track:#3A3535;--soft:#2A2224;--ok:#B08A72}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--bur);outline-offset:2px}
main{max-width:560px;margin:0 auto;padding:16px 16px 150px}
.serif,h1,h2,.big,b.n{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif}
h1{font-size:26px;margin:4px 0 12px;color:var(--head)}
h2{font-size:19px;margin:0 0 12px;color:var(--head)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px;width:100%;text-align:left;display:block}
.mon{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.mon span{font-family:Georgia,serif;font-size:22px;color:var(--head)}
.mon button{background:var(--card);border:1px solid var(--line);border-radius:10px;width:44px;height:44px;font-size:20px}
.hero{background:var(--bur);border-color:var(--bur);color:#fff}
.hero .lab{opacity:.85}
.big{font-size:42px;line-height:1.1;margin:2px 0 14px;color:#fff}
.bar{height:16px;border-radius:8px;background:rgba(255,255,255,.25);overflow:hidden}
.bar i{display:block;height:100%;background:#fff;border-radius:8px}
.bl{margin:8px 0 14px;font-size:14px;opacity:.9}
.io{display:flex;gap:12px}
.io div{flex:1;background:rgba(0,0,0,.22);border-radius:10px;padding:10px 12px}
.io span{display:block;font-size:13px;opacity:.85}
.io b{font-size:19px}
.neg{color:#FFD3DB}
.due{background:var(--soft);border-color:var(--bur);color:var(--ink)}
.due b{color:var(--bur)}
.dn{display:flex;align-items:center;gap:16px}
.dn .w{position:relative;width:128px;height:128px;flex:none}
.dn .w svg{width:100%;height:100%}
.dn .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;color:var(--mute);text-align:center}
.dn .c b{font-size:15px;color:var(--head)}
.lg{flex:1;min-width:0}
.lg div{display:flex;align-items:center;gap:8px;padding:3px 0;font-size:14px}
.lg i{width:10px;height:10px;border-radius:3px;flex:none}
.lg span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lg em{font-style:normal;color:var(--mute)}
.tr{display:flex;gap:8px;height:130px;align-items:flex-end}
.tc{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end;gap:6px;font-size:12px;color:var(--mute)}
.pair{display:flex;align-items:flex-end;gap:3px;height:100px;width:100%;justify-content:center}
.pair i{width:38%;max-width:18px;border-radius:4px 4px 0 0;min-height:2px}
.bi{background:var(--track)}.bo{background:var(--bur)}
.key{display:flex;gap:16px;font-size:13px;color:var(--mute);margin-top:10px}
.key i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.empty{color:var(--mute);margin:0}
.grp{font-family:Georgia,serif;color:var(--head);margin:18px 2px 8px;font-size:16px}
.row{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .t{flex:1;min-width:0}
.row .t small{display:block;color:var(--mute)}
.row .a{font-family:Georgia,serif;font-weight:700;white-space:nowrap}
.in{color:var(--ok)}
.x{background:none;border:0;color:var(--mute);font-size:20px;width:40px;height:40px;border-radius:8px}
.btn{background:var(--bur);color:#fff;border:0;border-radius:10px;padding:11px 18px;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:7px 12px;font-size:14px}
.btn.paid{background:transparent;color:var(--ok);border:1px solid var(--ok)}
.late{color:var(--bur);font-weight:600}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;background:none;border:0;padding:14px 4px;color:var(--mute);font-size:14px}
nav button.on{color:var(--bur);font-weight:700;box-shadow:inset 0 3px 0 var(--bur)}
.fab{position:fixed;right:16px;bottom:calc(68px + env(safe-area-inset-bottom,0px));z-index:6;box-shadow:0 4px 14px rgba(0,0,0,.3);padding:14px 22px;border-radius:28px}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
#sheet[hidden]{display:none}
.panel{background:var(--card);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));max-height:90%;overflow:auto}
.panel label{display:block;font-size:14px;color:var(--mute);margin-bottom:12px}
.panel input,.panel select{display:block;width:100%;margin-top:4px;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:16px}
.panel input.err{border-color:var(--bur);box-shadow:0 0 0 2px var(--bur)}
.panel .btns{display:flex;gap:10px;justify-content:flex-end;margin-top:6px}
.seg{display:flex;gap:6px;margin-bottom:14px}
.seg button{flex:1;padding:10px;border:1px solid var(--line);background:transparent;border-radius:10px}
.seg button.on{background:var(--bur);border-color:var(--bur);color:#fff;font-weight:600}
.set{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0}
.set select{width:auto;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.add{display:flex;gap:8px;margin-top:10px}
.add input{flex:1;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.note{color:var(--mute);font-size:14px}

.due{border-color:#8B1A32}

 body{padding-left:200px}
 nav{top:0;bottom:auto;right:auto;width:200px;height:100%;flex-direction:column;justify-content:flex-start;padding-top:24px;border-top:0;border-right:1px solid #5C4033}

<body>
<main id="main"></main>
<button class="btn fab" id="fab" onclick="fab()">Add entry</button>
<nav id="nav"></nav>
<div id="sheet" hidden></div>
<script>
const K='ledger_v1',PAL=['#8B1A32','#A0704A','#6B1B2E','#C4A484','#7A736F','#5E463A','#B8B0AB','#7A2E22','#8A7B6E','#D8CCC0'],INC=['Salary','Side income','Other income'];
const def=()=>({tx:[],bills:[],paid:{},cats:['Housing','Food & Groceries','Transport','Utilities','Health','Entertainment','Shopping','Savings','Other'],cur:'R',daily:true,debts:[],theme:'dark',budgets:{},plan:{s:'avalanche',x:0},goals:[],assets:[],nw:{},scheme:'burgundy',style:'terminal'});
let S=(()=>{try{const r=localStorage.getItem(K);if(r)return Object.assign(def(),JSON.parse(r))}catch(e){}return def()})();
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
if(!S.zar){S.cur='R';S.zar=1;save()}
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const sum=a=>a.reduce((s,x)=>s+x,0);
const fmt=n=>S.cur+Number(n).toLocaleString(S.cur==='R'?'en-ZA':undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const mname=(m,o)=>{const[y,mo]=m.split('-').map(Number);return new Date(y,mo-1,1).toLocaleString(undefined,o||{month:'long',year:'numeric'})};
const shift=(m,d)=>{const[y,mo]=m.split('-').map(Number),dt=new Date(y,mo-1+d,1);return dt.getFullYear()+'-'+pad(dt.getMonth()+1)};
const ord=n=>n+(['th','st','nd','rd'][(n%100>>3^1&&n%10<4)?n%10:0]||'th');
const col=c=>{let i=S.cats.indexOf(c);if(i<0)i=S.cats.length;return PAL[i%PAL.length]};
let ym=today().slice(0,7),tab='home',mode='out',reset=false;

function billsFor(m){const[y,mo]=m.split('-').map(Number),last=new Date(y,mo,0).getDate();
 return S.bills.filter(b=>!b.paused&&b.start<=m).map(b=>{const key=b.id+'|'+m;return{b,key,date:m+'-'+pad(Math.min(b.day,last)),paid:S.paid[key]}})}
function tot(m){const t=S.tx.filter(x=>x.date.startsWith(m)),p=Object.entries(S.paid).filter(([k])=>k.endsWith('|'+m)).map(e=>e[1]).filter(v=>!v.d);
 return{t,p,inc:sum(t.filter(x=>x.type==='in').map(x=>x.amt)),out:sum(t.filter(x=>x.type==='out').map(x=>x.amt))+sum(p.map(x=>x.a))}}
function byCat(m){const r={},T=tot(m);T.t.filter(x=>x.type==='out').forEach(x=>r[x.cat]=(r[x.cat]||0)+x.amt);T.p.forEach(x=>r[x.c]=(r[x.c]||0)+x.a);return r}

const monthBar=()=>`<div class="mon"><button aria-label="Previous month" onclick="mv(-1)">&lt;</button><span>[ ${mname(ym)} ]</span><button aria-label="Next month" onclick="mv(1)">&gt;</button></div>`;
function mv(d){ym=shift(ym,d);render()}
function go(t){tab=t;render();scrollTo(0,0)}

const mdays=m=>{const[y,mo]=m.split('-').map(Number);return new Date(y,mo,0).getDate()};
function setBudget(c,v){const n=parseFloat(String(v).replace(',','.'));if(n>0)S.budgets[c]=n;else delete S.budgets[c];save()}
function safeLine(T){
 if(ym!==today().slice(0,7)||!T.inc)return'';
 const unpaid=sum(billsFor(ym).filter(x=>!x.paid).map(x=>x.b.amount)),left=T.inc-T.out-unpaid,d=mdays(ym)-new Date().getDate()+1;
 return `<div class="bl">${left>=0?'safe_to_spend: '+fmt(left/d)+' a day for '+d+' more day'+(d>1?'s':''):'after bills you are '+fmt(-left)+' short this month'}</div>`}
const quickCard=()=>`<section class="card"><h2>Quick add</h2><p class="note" style="margin:0">Type it like you say it, for example "lunch 85 food". Start with + for income.</p><div class="add"><input id="qa" placeholder="coffee 45" onkeydown="if(event.key==='Enter')quickAdd()"><button class="btn" onclick="quickAdd()">Add</button></div></section>`;
function quickAdd(){
 const el=$('qa'),t=el.value.trim(),m=t.match(/(\d+(?:[.,]\d+)?)/),amt=m?parseFloat(m[1].replace(',','.')):0;
 if(!(amt>0)){el.classList.add('err');return}
 const inc=t[0]==='+',tk=t.replace(m[0],'').replace('+','').split(/\s+/).filter(Boolean);let cat=inc?'Other income':'Other';
 if(inc){const i=tk.findIndex(w=>INC.some(c=>c.toLowerCase().startsWith(w.toLowerCase())&&w.length>2));if(i>=0){cat=INC.find(c=>c.toLowerCase().startsWith(tk[i].toLowerCase()));tk.splice(i,1)}}
 else{const i=tk.findIndex(w=>w.length>2&&S.cats.some(c=>c.toLowerCase().includes(w.toLowerCase())));
  if(i>=0){cat=S.cats.find(c=>c.toLowerCase().includes(tk[i].toLowerCase()));tk.splice(i,1)}
  else{const past=S.tx.slice().reverse().find(x=>x.type==='out'&&x.note&&x.note.toLowerCase()===tk.join(' ').toLowerCase());if(past)cat=past.cat}}
 const date=ym===today().slice(0,7)?today():ym+'-01',id=uid();
 S.tx.push({id,type:inc?'in':'out',amt,cat,date,note:tk.join(' ').slice(0,200)});save();render();
 undo('Added '+fmt(amt)+' to '+esc(cat),()=>{S.tx=S.tx.filter(x=>x.id!==id);save();render()})}
function budgetCard(cat){
 const L=S.cats.filter(c=>S.budgets[c]);if(!L.length)return'';
 return `<section class="card"><h2>Budgets</h2>${L.map(c=>{const sp=cat[c]||0,b=S.budgets[c],r=sp/b;return `<div style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;gap:8px"><span>${esc(c)}</span><span class="${r>1?'late':''}">${fmt(sp)} / ${fmt(b)}</span></div><div class="bar" style="color:${r>1?'var(--late)':'var(--acc)'}">${pbar(sp,b)}</div>${r>1?`<small class="late">over by ${fmt(sp-b)}</small>`:r>=.8?'<small class="note">nearly at the limit</small>':''}</div>`}).join('')}</section>`}
function insightCard(){
 const o=[],pm=shift(ym,-1),d=ym===today().slice(0,7)?new Date().getDate():mdays(ym);
 const upto=(m,dd)=>sum(S.tx.filter(x=>x.type==='out'&&x.date.startsWith(m)&&+x.date.slice(8)<=dd).map(x=>x.amt));
 const a=upto(ym,d),b=upto(pm,d);
 if(a&&b){const q=Math.round((a-b)/b*100);o.push(Math.abs(q)<5?'Your spending pace matches last month.':'You are spending '+Math.abs(q)+'% '+(q>0?'more':'less')+' than at this point last month.')}
 const c1=byCat(ym),c0=byCat(pm);let best=null;
 Object.keys(c1).forEach(c=>{const dl=c1[c]-(c0[c]||0);if(c0[c]&&dl>0&&(!best||dl>best[1]))best=[c,dl]});
 if(best)o.push(esc(best[0])+' is your biggest increase, up '+fmt(best[1])+' on last month.');
 const prior=S.tx.filter(x=>x.type==='out'&&x.date<ym+'-01');let odd=null;
 S.tx.filter(x=>x.type==='out'&&x.date.startsWith(ym)).forEach(x=>{const p=prior.filter(y=>y.cat===x.cat);if(p.length>=3&&x.amt>sum(p.map(y=>y.amt))/p.length*3&&(!odd||x.amt>odd.amt))odd=x});
 if(odd)o.push(fmt(odd.amt)+' on '+esc(odd.cat)+(odd.note?' ('+esc(odd.note)+')':'')+' is far above your usual for that category.');
 if(!Object.keys(S.budgets).length)o.push('Set a limit per category in Setup to track budgets here.');
 if(!o.length)o.push('Log a few weeks of spending and insights will appear here.');
 return `<section class="card"><h2>Insights</h2>${o.map(t=>`<p class="note" style="margin:6px 0">// ${t}</p>`).join('')}</section>`}
function payoff(){
 const D=S.debts.filter(g=>g.bal>0).map(g=>({n:g.name,b:g.bal,r:(g.rate||0)/1200,m:(S.bills.find(x=>x.id===g.bill)||{}).amount||0}));
 if(!D.length)return null;
 const pool=S.plan.x+sum(D.map(g=>g.m));if(pool<=0)return{err:'Link a bill to each debt, or add an extra monthly amount, to see a payoff date.'};
 let months=0,int=0;const order=[];
 while(D.some(g=>g.b>0.005)&&months<600){
  months++;D.forEach(g=>{if(g.b>0){const i=g.b*g.r;g.b+=i;int+=i}});
  let av=pool;const act=D.filter(g=>g.b>0.005).sort((x,y)=>S.plan.s==='snowball'?x.b-y.b:(y.r-x.r)||(x.b-y.b));
  act.forEach(g=>{const q=Math.min(g.m,g.b,av);g.b-=q;av-=q});
  act.forEach(g=>{if(av>0&&g.b>0){const q=Math.min(g.b,av);g.b-=q;av-=q}});
  D.forEach(g=>{if(g.b<=0.005&&!g.done){g.done=1;order.push(g.n+' (month '+months+')')}})}
 return months>=600?{err:'At these payments the debts never clear. Raise the extra amount.'}:{months,int,order}}
function planCard(){
 const po=payoff();if(!po)return'';
 const when=po.months?(()=>{const d=new Date();d.setMonth(d.getMonth()+po.months);return d.toLocaleString(undefined,{month:'long',year:'numeric'})})():'';
 return `<section class="card"><h2>Payoff plan</h2><div class="set"><span>Strategy</span><select onchange="S.plan.s=this.value;save();render()"><option value="avalanche" ${S.plan.s==='avalanche'?'selected':''}>avalanche</option><option value="snowball" ${S.plan.s==='snowball'?'selected':''}>snowball</option></select></div><div class="set"><span>Extra per month</span><input inputmode="decimal" value="${S.plan.x||''}" placeholder="0" onchange="S.plan.x=Math.max(0,parseFloat(String(this.value).replace(',','.'))||0);save();render()" style="width:110px;padding:8px;border:1px solid var(--line);background:var(--bg)"></div>`
 +(po.err?`<p class="note">${po.err}</p>`:`<p class="note" style="margin:6px 0">// debt free in ${po.months} months, around ${when}</p><p class="note" style="margin:6px 0">// interest still to pay: about ${fmt(po.int)}</p><p class="note" style="margin:6px 0">// order: ${po.order.map(esc).join(', ')}</p><p class="note" style="margin:6px 0">// avalanche clears the highest rate first, snowball the smallest balance first. A projection from your linked bills, not your logged payments.</p>`)+`</section>`}
const goalOf=id=>S.goals.find(g=>g.id===id);
const nbox='width:110px;padding:8px;border:1px solid var(--line);background:var(--bg)';
function goals(){
 const gs=sum(S.goals.map(g=>g.saved)),as=sum(S.assets.map(a=>a.val)),owe=sum(S.debts.map(g=>g.bal)),nw=gs+as-owe,cm=today().slice(0,7);
 if(S.nw[cm]!==nw){S.nw[cm]=nw;save()}
 const pk=Object.keys(S.nw).filter(k=>k<cm).sort().pop(),ch=pk!==undefined?nw-S.nw[pk]:null;
 return `<section class="card hero"><div class="lab">net_worth</div><div class="big ${nw<0?'neg':''}">${fmt(nw)}</div><div class="bl">${ch===null?'Saved as your first snapshot. Monthly change shows from next month.':(ch>=0?'up ':'down ')+fmt(Math.abs(ch))+' since '+mname(pk)}</div><div class="io"><div><span>assets</span><b class="n">${fmt(gs+as)}</b></div><div><span>owed</span><b class="n">${fmt(owe)}</b></div></div></section>`
 +S.goals.map(g=>{const rem=Math.max(0,g.target-g.saved);let need='';
  if(rem<=0)need='goal reached';
  else if(g.by){const mo=Math.max(1,Math.ceil((new Date(g.by+'T00:00')-new Date())/2629800000));need='save '+fmt(rem/mo)+' a month to hit '+new Date(g.by+'T00:00').toLocaleDateString(undefined,{month:'short',year:'numeric'})}
  return `<section class="card"><div style="display:flex;justify-content:space-between;gap:8px"><b class="n">${esc(g.name)}</b><b class="n">${fmt(g.saved)}</b></div><div class="note">of ${fmt(g.target)}${need?', '+need:''}</div><div class="bar" style="color:var(--acc);margin-top:8px">${pbar(g.saved,g.target)}</div>${g.hist.slice(-3).reverse().map(h=>`<div class="row"><div class="t">${h.date}<small>${h.amt>=0?'added':'taken out'}</small></div><span class="a ${h.amt>=0?'in':''}">${h.amt>=0?'+':'-'}${fmt(Math.abs(h.amt))}</span><button class="x" aria-label="Delete entry" onclick="delMove('${g.id}','${h.id}')">×</button></div>`).join('')}<div class="acts"><button class="btn sm" onclick="moveForm('${g.id}',1)">Add money</button><button class="btn sm ghost" onclick="moveForm('${g.id}',-1)">Take out</button><button class="btn sm ghost" onclick="goalForm('${g.id}')">Edit</button><button class="btn sm ghost" onclick="delGoal('${g.id}')">Delete</button></div></section>`}).join('')
 +(S.goals.length?'':'<section class="card"><p class="empty">Add a goal like an emergency fund or a holiday, then log money towards it.</p></section>')
 +`<section class="card"><h2>Other assets</h2>`+S.assets.map(a=>`<div class="row"><div class="t">${esc(a.name)}</div><input inputmode="decimal" value="${a.val}" aria-label="Value of ${esc(a.name)}" onchange="setAsset('${a.id}',this.value)" style="${nbox}"><button class="x" aria-label="Delete asset" onclick="delAsset('${a.id}')">×</button></div>`).join('')+`<div class="acts"><button class="btn sm ghost" onclick="assetForm()">Add asset</button></div><p class="note">Cash, bank balances, a car or anything else you own. Goal money is added and debts are taken off automatically. Goal deposits are not counted in your monthly totals.</p></section>`}
function setAsset(id,v){const a=S.assets.find(x=>x.id===id),n=parseFloat(String(v).replace(',','.'));if(a&&n>=0){a.val=n;save();render()}}
function delAsset(id){const a=S.assets.find(x=>x.id===id);S.assets=S.assets.filter(x=>x.id!==id);save();render();undo('Asset deleted',()=>{S.assets.push(a);save();render()})}
function assetForm(){sheet('Add asset',`<label>Name<input id="an" placeholder="Bank account, car"></label><label>Value<input id="av" inputmode="decimal"></label>`,()=>{const n=$('an').value.trim(),v=gz('av',1);$('an').classList.toggle('err',!n);if(!n||v===null)return false;S.assets.push({id:uid(),name:n.slice(0,60),val:v});save();render()})}
function goalForm(id){const g=goalOf(id)||{name:'',target:'',saved:'',by:''};
 sheet(id?'Edit goal':'Add goal',`<label>Goal name<input id="on" value="${esc(g.name)}" placeholder="Emergency fund"></label><label>Target amount<input id="ot" inputmode="decimal" value="${g.target}"></label>${id?'':'<label>Already saved (optional)<input id="os" inputmode="decimal"></label>'}<label>Target date (optional)<input id="ob" type="date" value="${g.by}"></label>`,()=>{
  const n=$('on').value.trim(),t=num('ot'),s0=id?0:gz('os');$('on').classList.toggle('err',!n);if(!n||t===null||s0===null)return false;
  if(id)Object.assign(goalOf(id),{name:n.slice(0,60),target:t,by:$('ob').value});else S.goals.push({id:uid(),name:n.slice(0,60),target:t,saved:s0,by:$('ob').value,hist:[]});save();render()})}
function moveForm(id,sg){const g=goalOf(id);
 sheet((sg>0?'Add money to ':'Take money from ')+esc(g.name),`<label>Amount<input id="ma" inputmode="decimal"></label><label>Date<input id="md" type="date" value="${today()}"></label>`,()=>{
  const a=num('ma');if(a===null)return false;const amt=sg>0?a:-Math.min(a,g.saved);g.hist.push({id:uid(),date:$('md').value||today(),amt});g.saved=Math.max(0,g.saved+amt);save();render()})}
function delMove(gid,hid){const g=goalOf(gid),h=g&&g.hist.find(x=>x.id===hid);if(!h)return;g.saved=Math.max(0,g.saved-h.amt);g.hist=g.hist.filter(x=>x!==h);save();render()}
function delGoal(id){const g=goalOf(id);S.goals=S.goals.filter(x=>x.id!==id);save();render();undo('Goal deleted',()=>{S.goals.push(g);save();render()})}
function home(){
 const T=tot(ym),net=T.inc-T.out,pct=T.inc?Math.min(100,T.out/T.inc*100):(T.out?100:0),cat=byCat(ym),due=billsFor(ym).filter(x=>!x.paid);
 const e=Object.entries(cat).sort((a,b)=>b[1]-a[1]),tt=sum(e.map(x=>x[1]));let off=25;
 const arcs=e.map(([c,v])=>{const p=v/tt*100,s=`<circle r="15.9155" cx="21" cy="21" fill="none" stroke="${col(c)}" stroke-width="6" stroke-dasharray="${Math.max(p-.6,.1)} ${100-Math.max(p-.6,.1)}" stroke-dashoffset="${off}"/>`;off-=p;return s}).join('');
 const ms=[-5,-4,-3,-2,-1,0].map(d=>shift(ym,d)).map(m=>({m,...tot(m)})),mx=Math.max(1,...ms.map(x=>Math.max(x.inc,x.out)));
 return monthBar()+`<section class="card hero"><div class="lab">left_this_month</div><div class="big ${net<0?'neg':''}">${fmt(net)}</div>
 <div class="bar">[${'█'.repeat(Math.round(pct/5))}${'░'.repeat(20-Math.round(pct/5))}]</div>
 <div class="bl">${T.inc?(T.out>T.inc?'Spending is above income':Math.round(T.out/T.inc*100)+'% of income spent'):(T.out?'No income logged yet':'Nothing logged yet')}</div>${safeLine(T)}
 <div class="io"><div><span>money_in</span><b class="n">${fmt(T.inc)}</b></div><div><span>money_out</span><b class="n">${fmt(T.out)}</b></div></div></section>`
 +(due.length?`<button class="card due" onclick="go('bills')"><b class="n">${due.length} bill${due.length>1?'s':''} still to pay</b><br><span class="note">${fmt(sum(due.map(x=>x.b.amount)))} due this month. Tap to see them.</span></button>`:'')
 +quickCard()+budgetCard(cat)+insightCard()+`<section class="card"><h2>Where it went</h2>`+(e.length?`<div class="dn"><div class="w"><svg viewBox="0 0 42 42">${arcs}</svg><div class="c">Spent<b>${fmt(tt)}</b></div></div><div class="lg">${e.map(([c,v])=>`<div><i style="background:${col(c)}"></i><span>${esc(c)}</span><em>${Math.round(v/tt*100)}%</em></div>`).join('')}</div></div>`:`<p class="empty">Add an expense and your spending split shows up here.</p>`)+`</section>
 <section class="card"><h2>Last six months</h2><div class="tr">${ms.map(x=>`<div class="tc"><div class="pair"><i class="bi" style="height:${x.inc/mx*100}%"></i><i class="bo" style="height:${x.out/mx*100}%"></i></div><span>${mname(x.m,{month:'short'})}</span></div>`).join('')}</div>
 <div class="key"><span><i style="background:var(--track)"></i>In</span><span><i style="background:var(--bur)"></i>Out</span></div></section>`;
}

function log(){
 const t=S.tx.filter(x=>x.date.startsWith(ym)).sort((a,b)=>b.date.localeCompare(a.date)),g={};
 t.forEach(x=>{const k=S.daily?x.date:(x.type==='in'?'Income':x.cat);(g[k]=g[k]||[]).push(x)});
 return monthBar()+(t.length?Object.entries(g).map(([k,l])=>`<div class="grp" style="display:flex;justify-content:space-between;gap:8px"><span>${S.daily?new Date(k+'T00:00').toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'short'}):esc(k)}</span><span>${l.some(x=>x.type==='out')?'-'+fmt(sum(l.filter(x=>x.type==='out').map(x=>x.amt))):''}</span></div><section class="card" style="padding:4px 16px">${l.map(x=>`<div class="row"><div class="t" style="cursor:pointer" onclick="txForm('${x.id}')">${esc(x.note||x.cat)}<small>${esc(x.cat)}</small></div><span class="a ${x.type==='in'?'in':''}">${x.type==='in'?'+':'-'}${fmt(x.amt)}</span><button class="x" aria-label="Delete entry" onclick="delTx('${x.id}')">×</button></div>`).join('')}</section>`).join(''):`<section class="card"><p class="empty">No entries this month yet. Tap Add entry to log your first one.</p></section>`);
}
let ut;function undo(msg,fn){clearTimeout(ut);let t=$('toast');if(!t){t=document.createElement('div');t.id='toast';t.className='toast';document.body.appendChild(t)}
 t.innerHTML='<span>'+msg+'</span><button>undo</button>';t.hidden=false;t.querySelector('button').onclick=()=>{fn();t.hidden=true};ut=setTimeout(()=>{t.hidden=true},6000)}
function delTx(id){const x=S.tx.find(y=>y.id===id);S.tx=S.tx.filter(y=>y.id!==id);save();render();undo('Entry deleted',()=>{S.tx.push(x);save();render()})}

function bills(){
 const L=billsFor(ym),td=today(),rank=x=>x.paid?2:(x.date<td?0:1);
 L.sort((a,b)=>rank(a)-rank(b)||a.date.localeCompare(b.date));
 const amt=x=>x.paid?x.paid.a:x.b.amount,T=sum(L.map(amt)),PS=sum(L.filter(x=>x.paid).map(amt)),late=L.filter(x=>!x.paid&&x.date<td).length,f=T?Math.round(PS/T*20):0;
 const days=d=>Math.round((new Date(d+'T00:00')-new Date(td+'T00:00'))/864e5);
 const st=x=>{if(x.paid)return 'paid';const n=days(x.date);return n<0?'overdue by '+(-n)+(n===-1?' day':' days'):n===0?'due today':'due in '+n+(n===1?' day':' days')};
 return monthBar()+`<section class="card hero"><div class="lab">still_to_pay</div><div class="big">${fmt(T-PS)}</div><div class="bar">[${'█'.repeat(f)}${'░'.repeat(20-f)}]</div><div class="bl">${fmt(PS)} paid of ${fmt(T)}${late?', '+late+' overdue':''}</div></section><section class="card" style="padding:4px 16px">`+(L.length?L.map(x=>`<div class="row"><div class="t">${esc(x.b.name)}${dOf(x.b.id)?' (debt)':''}<small class="${!x.paid&&x.date<td?'late':''}">${st(x)}, ${new Date(x.date+'T00:00').toLocaleDateString(undefined,{day:'numeric',month:'short'})}</small></div><span class="a">${fmt(amt(x))}</span><button class="btn sm ${x.paid?'paid':''}" onclick="pay('${x.key}')">${x.paid?'Paid':'Mark paid'}</button></div>`).join(''):'<p class="empty" style="padding:12px 0">No bills set up yet. Add one once and it appears every month.</p>')+`</section><h1>Your recurring bills</h1><p class="note">${fmt(sum(S.bills.filter(b=>!b.paused).map(b=>b.amount)))} per month in total, about ${fmt(12*sum(S.bills.filter(b=>!b.paused).map(b=>b.amount)))} a year.</p>`+S.bills.map(b=>`<section class="card"><div style="display:flex;justify-content:space-between;gap:8px"><b class="n">${esc(b.name)}${b.paused?' (paused)':''}</b><b class="n">${fmt(b.amount)}</b></div><div class="note">${esc(b.cat)}, due on the ${ord(b.day)} each month${dOf(b.id)?', linked to a debt':''}</div><div class="acts"><button class="btn sm ghost" onclick="billForm('${b.id}')">Edit</button><button class="btn sm ghost" onclick="pauseBill('${b.id}')">${b.paused?'Resume':'Pause'}</button><button class="btn sm ghost" onclick="delBill('${b.id}')">Delete</button></div></section>`).join('');
}
const dget=id=>S.debts.find(g=>g.id===id),dOf=bid=>S.debts.find(g=>g.bill===bid);
const pbar=(a,b)=>{const f=b>0?Math.round(Math.min(1,a/b)*20):0;return '[<span class="bf">'+'█'.repeat(f)+'</span>'+'░'.repeat(20-f)+']'};
function debts(){

function clean(d){
 const okId=x=>typeof x==='string'&&ID.test(x);
 if(!d||!Array.isArray(d.tx)||!Array.isArray(d.bills)||!Array.isArray(d.cats)||!d.paid||typeof d.paid!=='object')return null;

 const bills=d.bills.filter(b=>b&&okId(b.id)&&typeof b.name==='string'&&b.amount>0&&b.day>=1&&b.day<=31&&YM.test(b.start)&&typeof b.cat==='string').map(b=>({id:b.id,name:b.name.slice(0,60),amount:+b.amount,cat:b.cat.slice(0,40),day:Math.floor(b.day),start:b.start,paused:!!b.paused}));
 const paid={};Object.entries(d.paid).forEach(([k,v])=>{if(/^[a-z0-9]{3,24}\|\d{4}-\d\d$/.test(k)&&v&&v.a>=0&&typeof v.c==='string')paid[k]=Object.assign({a:+v.a,c:v.c.slice(0,40)},v.d&&okId(v.d)?{d:v.d,h:okId(v.h)?v.h:''}:{})});
 const debts=(Array.isArray(d.debts)?d.debts:[]).filter(g=>g&&okId(g.id)&&typeof g.name==='string'&&g.bal>=0&&g.start>=0).map(g=>({id:g.id,name:g.name.slice(0,60),start:+g.start,bal:+g.bal,rate:+g.rate||0,bill:okId(g.bill)?g.bill:'',hist:(Array.isArray(g.hist)?g.hist:[]).filter(h=>h&&okId(h.id)&&/^\d{4}-\d\d-\d\d$/.test(h.date)).map(h=>({id:h.id,date:h.date,pay:+h.pay||0,int:+h.int||0,red:+h.red||0,key:typeof h.key==='string'&&/^[a-z0-9]{3,24}\|\d{4}-\d\d$/.test(h.key)?h.key:'',note:String(h.note||'').slice(0,100)}))}));
 const budgets={};Object.entries(d.budgets&&typeof d.budgets==='object'?d.budgets:{}).forEach(([k,v])=>{if(k!=='__proto__'&&CN.test(k)&&v>0)budgets[k]=+v});

 const DT=/^\d{4}-\d\d-\d\d$/;

 const assets=(Array.isArray(d.assets)?d.assets:[]).filter(a=>a&&okId(a.id)&&typeof a.name==='string'&&a.val>=0).map(a=>({id:a.id,name:a.name.slice(0,60),val:+a.val}));
